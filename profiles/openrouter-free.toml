# OpenRouter free/stealth models via a Codex custom provider
# (model_providers.openrouter in ~/.codex/config.toml, wire_api = "responses",
# API key referenced by path — see the P1 ledger item). One configurable
# model for every tier: edit `[single]` below and every tier (chair, fable,
# opus, sonnet, cheap) resolves to it — there is deliberately no per-tier
# routing here, this profile exists for cheap/experimental work only.
#
#   NEVER FOR CUSTOMER OR CREDENTIAL WORK — existing rule (see CLAUDE.md
#   "claude-open OpenRouter wrapper" precedent). Stealth/free OpenRouter
#   models have no data-handling guarantee.
provider = "openrouter-free"
note = "never customer/credential work"

# Verified 2026-09-05: `codex exec -c model_provider=openrouter -m openrouter/free` → ok.
# Codex model ids carry NO provider prefix when model_provider is set;
# "openrouter/free" is OpenRouter's own free-router id. omen-alpha was not a valid id.
[single]
model = "openrouter/free"
model_reasoning_effort = "medium"
